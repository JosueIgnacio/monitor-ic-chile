name: Dashboard

# Construye el dashboard con todas las fotos de la rama `data`.
# - En cada PR: pruebas, build estricto, capturas comentadas en el PR y vista previa (si Cloudflare está configurado).
# - En main y después de cada ETL diario: publica a producción (si Cloudflare está configurado).
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: ["ETL diario"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Traer las fotos diarias (rama data)
        run: |
          git fetch --depth 1 origin data
          git worktree add ../data FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del ETL
        run: python -m pytest -q etl
      - name: Construir base DuckDB
        run: python -m etl.build_db --snapshots ../data/snapshots

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Instalar Evidence
        working-directory: dashboard
        run: npm ci
      - name: Construir el sitio
        working-directory: dashboard
        run: |
          npm run sources -- --strict
          npm run build:strict

      - name: Capturas de pantalla
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          (cd build && python -m http.server 4173 >/dev/null 2>&1 &)
          sleep 2
          node scripts/screenshots.mjs http://localhost:4173 ../screenshots | tee ../screenshots.log

      - name: Publicar capturas en el PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEST="pr-$PR/${SHA::7}"
          git config --global user.name "monitor-ic-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin capturas; then
            git worktree add ../capturas FETCH_HEAD && git -C ../capturas checkout -B capturas
          else
            git worktree add --orphan -b capturas ../capturas
          fi
          mkdir -p "../capturas/$DEST" && cp screenshots/*.png "../capturas/$DEST/"
          git -C ../capturas add -A && git -C ../capturas commit -qm "Capturas PR #$PR ($SHA)" && git -C ../capturas push origin capturas
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/capturas/$DEST"
          {
            echo "### Capturas del dashboard (commit ${SHA::7})"
            echo
            echo '```'
            cat screenshots.log
            echo '```'
            for p in resumen mapa territorio crecimiento operadores disponibilidad tarifas metodologia; do
              echo "<details><summary>$p</summary>"
              echo
              echo "![$p]($RAW/$p.png)"
              echo
              echo "</details>"
            done
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last || gh pr comment "$PR" --body-file comment.md

      - name: Publicar en Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          set -o pipefail
          # Crea el proyecto la primera vez (si ya existe, el comando falla y seguimos).
          npx wrangler@3.99.0 pages project create monitor-ic-chile --production-branch=main || true
          npx wrangler@3.99.0 pages deploy dashboard/build --project-name=monitor-ic-chile --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Sitio publicado en $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar la vista previa en el PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '### Vista previa\n\n%s\n\nCorresponde al commit %s.\n' "$URL" "${{ github.event.pull_request.head.sha }}" > preview.md
          gh pr comment "$PR" --body-file preview.md

      - name: Fallar si alguna página tuvo errores
        if: github.event_name == 'pull_request'
        run: "! grep -q '✗' screenshots.log"
